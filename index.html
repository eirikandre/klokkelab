<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1226" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f5ff" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<title>Klokkelab – lær å lese klokka, digital og analog</title>
<meta name="description" content="Gratis spill for å lære å lese klokka på norsk: hele og halve timer, kvart over og kvart på, fem over halv og 24-timersklokka – med digital og analog klokke.">
<link rel="canonical" href="https://klokkelab.eidsa.no/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Klokkelab">
<meta property="og:locale" content="nb_NO">
<meta property="og:url" content="https://klokkelab.eidsa.no/">
<meta property="og:title" content="Klokkelab – lær å lese klokka">
<meta property="og:description" content="Gratis spill for å lære å lese klokka på norsk: hele og halve timer, kvart over og kvart på, fem over halv og 24-timersklokka – med digital og analog klokke.">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Klokkelab",
  "url": "https://klokkelab.eidsa.no/",
  "description": "Gratis spill for å lære å lese klokka på norsk: hele og halve timer, kvart over og kvart på, fem over halv og 24-timersklokka – med digital og analog klokke.",
  "inLanguage": "nb",
  "applicationCategory": "EducationalApplication",
  "operatingSystem": "Alle (nettleser)",
  "isAccessibleForFree": true,
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "NOK" }
}
</script>
<script>
  /* sett valgt tema før siden tegnes, så den ikke blinker i feil farge */
  try { const t = JSON.parse(localStorage.getItem('klokkelab.v1') || '{}').theme;
        if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="logo">⏰</span> <span class="brandname">Klokkelab</span></div>
  <div class="topstats">
    <span class="chip" title="Poeng totalt">⭐ <b id="xpChip">0</b></span>
    <span class="chip" title="Beste rekke på rad">🔥 <b id="streakChip">0</b></span>
    <button id="themeBtn" class="iconbtn" title="Lyst/mørkt tema" aria-label="Bytt mellom lyst og mørkt tema">🌙</button>
    <button id="soundBtn" class="iconbtn" title="Lyd av/på" aria-label="Lyd av eller på">🔊</button>
  </div>
</header>

<main>

  <!-- ============ HJEM ============ -->
  <section id="screen-home" class="screen active">
    <h1>Hva er klokka?</h1>
    <p class="lead">Velg et nivå og svar på 10 spørsmål. Riktig svar gir poeng, og framgangen din lagres.</p>

    <div class="modepick" role="group" aria-label="Spillmodus">
      <button class="modebtn active" data-mode="read">🔢 ➜ <span class="faceicon">📝</span> Les klokka</button>
      <button class="modebtn" data-mode="set"><span class="faceicon">📝</span> ➜ 🔢 Sett klokka</button>
      <button class="modebtn" data-mode="mix">🔀 Blandet</button>
    </div>

    <div class="modepick facepick" role="group" aria-label="Vis klokkeslettet som">
      <button class="modebtn active" data-face="text">📝 Tekst</button>
      <button class="modebtn" data-face="analog">🕰️ Analog klokke</button>
    </div>

    <div id="levelGrid" class="levelgrid"></div>

    <button id="statsLink" class="linkbtn">📈 Se progresjonen min</button>
    <a class="privacylink" href="personvern.html">🔒 Personvern</a>
  </section>

  <!-- ============ QUIZ ============ -->
  <section id="screen-quiz" class="screen">
    <div class="quizbar">
      <button id="quitBtn" class="iconbtn" aria-label="Avslutt runde">✕</button>
      <div class="progresswrap"><div id="progressFill" class="progressfill"></div></div>
      <div class="qcount"><b id="qNow">1</b>/<span id="qTotal">10</span></div>
    </div>

    <div id="questionArea" class="qarea"></div>

    <div id="answers" class="answers"></div>

    <div id="feedback" class="feedback" aria-live="polite"></div>
    <button id="nextBtn" class="primary hidden">Neste →</button>
  </section>

  <!-- ============ OPPSUMMERING ============ -->
  <section id="screen-summary" class="screen">
    <div id="summaryCard" class="summary"></div>
    <div class="rowbtns">
      <button id="againBtn" class="primary">🔁 Spill igjen</button>
      <button id="homeBtn" class="ghost">🏠 Til forsiden</button>
    </div>
  </section>

  <!-- ============ PROGRESJON ============ -->
  <section id="screen-stats" class="screen">
    <h2>📈 Progresjonen din</h2>
    <div id="statsTop" class="statstop"></div>

    <h3>Siste 7 dager</h3>
    <div id="chart" class="chart"></div>

    <h3>Nivåene dine</h3>
    <div id="levelStats" class="levelstats"></div>

    <h3>Merker</h3>
    <div id="badges" class="badges"></div>

    <div class="rowbtns">
      <button id="backBtn" class="primary">← Tilbake</button>
      <button id="resetBtn" class="danger">🗑 Nullstill framgang</button>
    </div>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
